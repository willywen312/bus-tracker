<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS 發射端｜娃娃車 GPS</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="tag">KINDERGARTEN BUS · GPS</div><h1>GPS 發射端</h1><nav><a href="index.html">首頁</a><a href="sender.html">GPS 發射端</a><a href="viewer.html">家長端</a></nav></header><noscript>請開啟 JavaScript 以使用定位與即時追蹤。</noscript><section class="card"><p>車輛：demo-bus-001</p><p id="status" class="status" role="status">正在連接 Firebase…</p><p id="connection">連線確認中</p><button id="start" disabled>開始 GPS 追蹤並上傳</button><button id="stop" class="secondary" disabled>停止追蹤</button><div class="grid"><div class="metric"><span>目前座標</span><strong id="coords">—</strong></div><div class="metric"><span>GPS 速度</span><strong id="speed">—</strong></div><div class="metric"><span>定位精度</span><strong id="accuracy">—</strong></div><div class="metric"><span>最後成功上傳</span><strong id="uploaded">—</strong></div></div><p class="note">請由隨車人員操作。保持網頁在前景與螢幕亮起；鎖定螢幕或切換 App 可能中斷定位。停止後，家長端仍會顯示最後位置，超過 60 秒標示過期。</p></section></main><script src="config.js"></script><script type="module">
const $ = id => document.getElementById(id);
const cfg = window.BUS_TRACKER_CONFIG;
const finite = v => typeof v === "number" && Number.isFinite(v);
const geoError = e => ({1:"定位權限遭拒，請允許網站使用位置。",2:"目前無法取得位置，請移至戶外再試。",3:"定位逾時，請確認定位服務與網路。"}[e.code] || e.message);
let db, ref, set, onValue, serverTimestamp;
try {
 const [app, database] = await Promise.all([
 import("https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js"),
 import("https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js")]);
 ({ref,set,onValue,serverTimestamp} = database);
 db = database.getDatabase(app.initializeApp(cfg.firebaseConfig));
 setup();
} catch(e) { $("status").textContent = "載入失敗，請檢查網路後重新整理：" + e.message; }

function setup(){
 let watchId=null, session=0, connected=false, pending=null, busy=false;
 const latest=ref(db,"vehicles/"+cfg.vehicleId+"/latest");
 onValue(ref(db,".info/connected"),snap=>{
   connected=snap.val()===true;
   $("connection").textContent=connected?"Firebase 已連線":"Firebase 未連線；等待網路恢復";
 });
 function stop(){
   session++;
   if(watchId!==null) navigator.geolocation.clearWatch(watchId);
   watchId=null; pending=null;
   $("start").disabled=false; $("stop").disabled=true;
   $("status").textContent="已停止追蹤；已送出的上傳可能仍會完成。";
 }
 async function flush(){
   if(busy || !pending) return;
   busy=true;
   const item=pending; pending=null;
   try{
     await set(latest,item.data);
     if(item.session===session){
       $("uploaded").textContent=new Date().toLocaleTimeString("zh-TW");
       $("status").textContent="追蹤中，位置已成功上傳。";
     }
   }catch(e){
     if(item.session===session) $("status").textContent="上傳失敗："+e.message+"；請檢查 Firebase Rules。";
   }finally{busy=false; if(pending) void flush();}
 }
 $("stop").onclick=stop;
 $("start").disabled=false;
 $("start").onclick=()=>{
   if(!window.isSecureContext || !navigator.geolocation){$("status").textContent="請使用支援定位的瀏覽器，並透過 HTTPS 開啟。";return;}
   const current=++session;
   $("start").disabled=true; $("stop").disabled=false;
   $("status").textContent="等待 GPS 定位與位置授權…";
   watchId=navigator.geolocation.watchPosition(pos=>{
     if(current!==session) return;
     const c=pos.coords;
     const speed=finite(c.speed)&&c.speed>=0?c.speed*3.6:null;
     $("coords").textContent=c.latitude.toFixed(6)+", "+c.longitude.toFixed(6);
     $("speed").textContent=speed===null?"無速度資料":speed.toFixed(1)+" km/h";
     $("accuracy").textContent="± "+Math.round(c.accuracy)+" 公尺";
     if(!connected){$("status").textContent="GPS 已取得，但 Firebase 未連線；恢復後等待新定位上傳。";return;}
     pending={session:current,data:{latitude:c.latitude,longitude:c.longitude,speedKmh:speed,accuracy:c.accuracy,gpsTimestamp:pos.timestamp,updatedAt:serverTimestamp()}};
     $("status").textContent="位置上傳中…";
     void flush();
   },e=>{
     if(current!==session) return;
     if(e.code===1) stop();
     $("status").textContent=geoError(e);
   },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
 };
 window.addEventListener("pagehide",stop);
}
</script></body></html>
