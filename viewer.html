<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家長端即時位置｜娃娃車 GPS</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="tag">KINDERGARTEN BUS · GPS</div><h1>家長端即時位置</h1><nav><a href="index.html">首頁</a><a href="sender.html">GPS 發射端</a><a href="viewer.html">家長端</a></nav></header><noscript>請開啟 JavaScript 以使用定位與即時追蹤。</noscript><section class="card"><p id="status" class="status" role="status">正在連接 Firebase…</p><p id="connection">連線確認中</p><div class="grid"><div class="metric"><span>車輛位置</span><strong id="coords">—</strong></div><div class="metric"><span>GPS 速度</span><strong id="speed">—</strong></div><div class="metric"><span>定位精度</span><strong id="accuracy">—</strong></div><div class="metric"><span>最後更新／GPS 資料年齡</span><strong id="updated">—</strong></div><div class="metric"><span>目的地直線距離</span><strong id="distance">—</strong></div><div class="metric"><span>簡易 ETA</span><strong id="eta">—</strong></div></div><p id="etaNote" class="note">先設定目的地。</p><a id="map" target="_blank" rel="noopener noreferrer" hidden>在 Google 地圖查看車輛位置</a></section><section class="card"><h2>設定接送目的地</h2><p class="note">目的地僅保存在這支手機的瀏覽器，不會上傳。也可用這支手機的目前位置作為固定接送點。</p><form id="destination"><div class="grid"><label>緯度<input id="lat" type="number" step="any" min="-90" max="90" required placeholder="例如 25.0330"></label><label>經度<input id="lng" type="number" step="any" min="-180" max="180" required placeholder="例如 121.5654"></label></div><button type="submit">儲存目的地</button><button type="button" id="locate" class="secondary">用這支手機目前位置</button><button type="button" id="clear" class="secondary">清除目的地</button></form><p id="destStatus" role="status"></p></section></main><script src="config.js"></script><script type="module">
const $ = id => document.getElementById(id);
const cfg = window.BUS_TRACKER_CONFIG;
const finite = v => typeof v === "number" && Number.isFinite(v);
const geoError = e => ({1:"定位權限遭拒，請允許網站使用位置。",2:"目前無法取得位置，請移至戶外再試。",3:"定位逾時，請確認定位服務與網路。"}[e.code] || e.message);
let db, ref, set, onValue, serverTimestamp;
try {
 const [app, database] = await Promise.all([
 import("https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js"),
 import("https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js")]);
 ({ref,set,onValue,serverTimestamp} = database);
 db = database.getDatabase(app.initializeApp(cfg.firebaseConfig));
 setup();
} catch(e) { $("status").textContent = "載入失敗，請檢查網路後重新整理：" + e.message; }

function distanceKm(a,b,c,d){
 const rad=x=>x*Math.PI/180;
 const h=Math.sin(rad(c-a)/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(rad(d-b)/2)**2;
 return 6371*2*Math.asin(Math.sqrt(Math.min(1,Math.max(0,h))));
}
function setup(){
 let data=null, destination=null, connected=false, denied=false, offset=0;
 const valid=(a,b)=>finite(a)&&finite(b)&&Math.abs(a)<=90&&Math.abs(b)<=180;
 try{const saved=JSON.parse(localStorage.getItem("bus-destination"));if(saved&&valid(saved.lat,saved.lng)) destination=saved;}catch{}
 function showDestination(){
   $("lat").value=destination?.lat??""; $("lng").value=destination?.lng??"";
 }
 showDestination();
 function save(lat,lng){
   destination={lat,lng};showDestination();
   try{localStorage.setItem("bus-destination",JSON.stringify(destination));$("destStatus").textContent="目的地已儲存在這支手機。";}catch{$("destStatus").textContent="目的地已設定，但此瀏覽器無法永久儲存。";}
   render();
 }
 $("destination").onsubmit=e=>{e.preventDefault();const a=Number($("lat").value),b=Number($("lng").value);if(valid(a,b))save(a,b);};
 $("clear").onclick=()=>{destination=null;try{localStorage.removeItem("bus-destination");}catch{}showDestination();$("destStatus").textContent="已清除目的地。";render();};
 $("locate").onclick=()=>{
   if(!window.isSecureContext||!navigator.geolocation){$("destStatus").textContent="請透過 HTTPS 開啟並允許定位。";return;}
   $("locate").disabled=true;$("destStatus").textContent="正在取得目前位置…";
   navigator.geolocation.getCurrentPosition(p=>{$("locate").disabled=false;save(p.coords.latitude,p.coords.longitude);},e=>{$("locate").disabled=false;$("destStatus").textContent=geoError(e);},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
 };
 onValue(ref(db,".info/serverTimeOffset"),s=>{offset=Number(s.val())||0;});
 onValue(ref(db,".info/connected"),s=>{connected=s.val()===true;$("connection").textContent=connected?"Firebase 已連線":"Firebase 未連線；顯示的是最後收到的資料";render();});
 onValue(ref(db,"vehicles/"+cfg.vehicleId+"/latest"),s=>{
   const v=s.val();
   data=v&&valid(v.latitude,v.longitude)&&finite(v.updatedAt)&&finite(v.gpsTimestamp)?v:null;
   denied=false;render();
 },e=>{denied=true;data=null;render();$("status").textContent="讀取失敗："+e.message+"；請檢查 Firebase Rules。";});
 function render(){
   if(!data){
     if(!denied)$("status").textContent="尚無有效位置，請先啟動發射端。";
     for(const id of ["coords","speed","accuracy","updated","distance","eta"])$(id).textContent="—";
     $("map").hidden=true;return;
   }
   const age=Math.max(0,(Date.now()+offset-data.gpsTimestamp)/1000);
   const stale=age>60;
   $("status").textContent=stale?"位置已超過 60 秒未更新，請聯絡隨車人員確認。":connected?"正在接收車輛位置":"連線中斷，等待恢復。";
   $("coords").textContent=data.latitude.toFixed(6)+", "+data.longitude.toFixed(6);
   const speed=finite(data.speedKmh)&&data.speedKmh>=0?data.speedKmh:null;
   $("speed").textContent=speed===null?"無速度資料":speed.toFixed(1)+" km/h";
   $("accuracy").textContent=finite(data.accuracy)?"± "+Math.round(data.accuracy)+" 公尺":"—";
   $("updated").textContent=new Date(data.updatedAt).toLocaleString("zh-TW")+" ／ "+Math.floor(age)+" 秒前";
   $("map").hidden=false;$("map").href="https://www.google.com/maps?q="+data.latitude+","+data.longitude;
   if(!destination){$("distance").textContent="—";$("eta").textContent="—";$("etaNote").textContent="請先設定目的地。";return;}
   const km=distanceKm(data.latitude,data.longitude,destination.lat,destination.lng);
   $("distance").textContent=km<1?Math.round(km*1000)+" 公尺":km.toFixed(2)+" 公里";
   if(stale||!connected){$("eta").textContent="暫停估算";$("etaNote").textContent="等待連線與新 GPS 位置；距離依最後座標計算。";return;}
   const fallback=speed===null||speed<cfg.minGpsSpeedKmh;
   const used=fallback?cfg.fallbackSpeedKmh:speed;
   const minutes=km/used*60;
   $("eta").textContent="約 "+Math.ceil(minutes)+" 分鐘";
   $("etaNote").textContent=(fallback?"使用預設速度 "+used+" km/h（GPS 無速度或低於 "+cfg.minGpsSpeedKmh+" km/h）。":"使用 GPS 速度估算。")+" 直線距離 ÷ 速度，不含道路、停靠與路況；停車時也可能有估算值，不能視為實際抵達時間。";
 }
 setInterval(render,1000);
}
</script></body></html>
